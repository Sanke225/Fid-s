# Services de développement : docker compose -f infra/docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: recette
      POSTGRES_PASSWORD: recette
      POSTGRES_DB: recette
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Instance distincte pour les bases des espaces (démos et espaces clients) : mesure d'isolation.
  tenant-db:
    image: postgres:17
    environment:
      POSTGRES_USER: recette_admin
      POSTGRES_PASSWORD: recette_admin
    ports:
      - "5433:5432"
    volumes:
      - tenant-db-data:/var/lib/postgresql/data

  # Routeur des démos : http://<app>.demo.localhost:8088 → conteneur de la démo.
  # Il ne lit que les conteneurs marqués fids.space=true par le worker (jamais les autres).
  edge:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`fids.space`,`true`)
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
    ports:
      - "8088:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interface web

volumes:
  db-data:
  tenant-db-data:
